<section class="presentation-block historique-block" id="historique">
  <div class="container">
    <div class="section-card historique-card" data-aos="fade-up">
      <div class="block-header">
        <h3>{{ 'presentation.historique.title' | translate }}</h3>
        <p>{{ 'presentation.historique.subtitle' | translate }}</p>
      </div>

      <div class="row gy-4 align-items-center">
        <div class="col-lg-6 order-2 order-lg-1">
          <div class="historique-text">
            <p>{{ 'presentation.par' | translate }}</p>
          </div>
        </div>
        <div class="col-lg-6 order-1 order-lg-2" data-aos="fade-up" data-aos-delay="100">
          <div class="img-wrap historique-img-wrap">
            <img
              src="assets/images/crmef3.jpg"
              class="img-fluid"
              [alt]="'presentation.titre' | translate"
            />
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
