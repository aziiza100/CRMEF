<div class="actualite-details-page">
  <div class="page-title" data-aos="fade">
    <div class="heading">
      <div class="container">
        <div class="row d-flex justify-content-center text-center">
          <div class="col-lg-8">
            <h1>{{ title }}</h1>
            <div class="meta-info justify-content-center mt-3">
              <span class="category-badge">{{ category }}</span>
              <span class="date"><i class="bi bi-calendar3"></i> {{ formattedDate }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <nav class="breadcrumbs">
      <div class="container">
        <ol>
          <li><a routerLink="/home">{{ 'nav.home' | translate }}</a></li>
          <li><a routerLink="/actualites">{{ 'nav.actualites' | translate }}</a></li>
          <li class="current">{{ category }}</li>
        </ol>
      </div>
    </nav>
  </div>

  <!-- Content Section -->
  <div class="details-content section-padding">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-10">
          <div class="main-image" *ngIf="image" data-aos="fade-up">
            <img [src]="image" [alt]="title" class="img-fluid rounded shadow-sm">
          </div>
          
          <div class="content-body" data-aos="fade-up" data-aos-delay="100">
            <p>{{ description }}</p>
          </div>
          
          <div class="back-link mt-5 text-center">
            <a routerLink="/actualites" class="btn btn-outline-primary rounded-pill px-4 py-2">
              <i class="bi" [ngClass]="translate.currentLang === 'ar' ? 'bi-arrow-right' : 'bi-arrow-left'"></i> 
              {{ 'common.back' | translate }} 
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
