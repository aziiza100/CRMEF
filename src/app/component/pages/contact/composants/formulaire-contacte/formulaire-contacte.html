<div class="contact-form-wrap" data-aos="fade-left">
  <div class="form-intro">
    <h3>{{ 'contact.form.title' | translate }}</h3>
    <p>{{ 'contact.form.subtitle' | translate }}</p>
  </div>

  <form
    (ngSubmit)="onSubmit(contactForm)"
    #contactForm="ngForm"
    class="contact-form"
    novalidate
  >
    <div class="form-row">
      <div class="form-group">
        <label for="contact-name">{{ 'contact.form.name' | translate }}</label>
        <input
          id="contact-name"
          type="text"
          name="name"
          [(ngModel)]="form.name"
          [placeholder]="'contact.form.namePlaceholder' | translate"
          required
        />
      </div>
      <div class="form-group">
        <label for="contact-email">{{ 'contact.form.email' | translate }}</label>
        <input
          id="contact-email"
          type="email"
          name="email"
          [(ngModel)]="form.email"
          [placeholder]="'contact.form.emailPlaceholder' | translate"
          required
          email
        />
      </div>
    </div>

    <div class="form-group">
      <label for="contact-subject">{{ 'contact.form.subject' | translate }}</label>
      <input
        id="contact-subject"
        type="text"
        name="subject"
        [(ngModel)]="form.subject"
        [placeholder]="'contact.form.subjectPlaceholder' | translate"
        required
      />
    </div>

    <div class="form-group">
      <label for="contact-message">{{ 'contact.form.message' | translate }}</label>
      <textarea
        id="contact-message"
        name="message"
        rows="5"
        [(ngModel)]="form.message"
        [placeholder]="'contact.form.messagePlaceholder' | translate"
        required
      ></textarea>
    </div>

    @if (loading) {
      <p class="form-note loading">{{ 'contact.form.loading' | translate }}</p>
    }
    @if (error) {
      <p class="form-note error">{{ error }}</p>
    }
    @if (sent) {
      <p class="form-note success">{{ 'contact.form.success' | translate }}</p>
    }

    <button type="submit" class="btn-send" [disabled]="loading || contactForm.invalid">
      {{ 'contact.form.submit' | translate }}
    </button>
  </form>
</div>
