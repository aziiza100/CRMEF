<main class="main">
  <div class="page-title" data-aos="fade">
    <div class="heading">
      <div class="container">
        <div class="row d-flex justify-content-center text-center">
          <div class="col-lg-8">
            <h1>{{ 'contact.title' | translate }}</h1>
            <p class="mb-0">{{ 'contact.subtitle' | translate }}</p>
          </div>
        </div>
      </div>
    </div>
    <nav class="breadcrumbs">
      <div class="container">
        <ol>
          <li><a routerLink="/home">{{ 'nav.home' | translate }}</a></li>
          <li class="current">{{ 'contact.breadcrumb' | translate }}</li>
        </ol>
      </div>
    </nav>
  </div>

  <section id="contact" class="contact section">
    <div class="container">
      <div class="contact-intro" data-aos="fade-up">
        <p>{{ 'contact.greeting' | translate }}</p>
      </div>

      <div class="row gy-5 contact-layout">
        <div class="col-lg-5 contact-sidebar">
          <app-information-contact></app-information-contact>
          <app-adresse-carte></app-adresse-carte>
        </div>
        <div class="col-lg-7 contact-form-col">
          <app-formulaire-contacte></app-formulaire-contacte>
        </div>
      </div>
    </div>
  </section>
</main>
