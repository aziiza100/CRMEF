<div class="actualites-page">
  <div class="page-title" data-aos="fade">
    <div class="heading">
      <div class="container">
        <div class="row d-flex justify-content-center text-center">
          <div class="col-lg-8">
            <h1>{{ 'actualites.hero.title' | translate }}</h1>
            <p class="mb-0">{{ 'actualites.hero.subtitle' | translate }}</p>
          </div>
        </div>
      </div>
    </div>
    <nav class="breadcrumbs">
      <div class="container">
        <ol>
          <li><a routerLink="/home">{{ 'nav.home' | translate }}</a></li>
          <li class="current">{{ 'actualites.breadcrumb' | translate }}</li>
        </ol>
      </div>
    </nav>
  </div>

  <!-- Tabs Navigation -->
  <div class="tabs-section">
    <div class="container">
      <div class="tabs-navigation" data-aos="fade-up">
        <button 
          class="tab-btn" 
          [class.active]="activeTab === 'all'" 
          (click)="setActiveTab('all')">
          <i class="bi bi-grid-3x3-gap"></i> {{ 'actualites.tabs.all' | translate }}
        </button>
        <button 
          class="tab-btn" 
          [class.active]="activeTab === 'announcements'" 
          (click)="setActiveTab('announcements')">
          <i class="bi bi-megaphone"></i> {{ 'actualites.tabs.announcements' | translate }}
        </button>
        <button 
          class="tab-btn" 
          [class.active]="activeTab === 'events'" 
          (click)="setActiveTab('events')">
          <i class="bi bi-calendar-event"></i> {{ 'actualites.tabs.events' | translate }}
        </button>
        <button 
          class="tab-btn" 
          [class.active]="activeTab === 'seminars'" 
          (click)="setActiveTab('seminars')">
          <i class="bi bi-mic"></i> {{ 'actualites.tabs.seminars' | translate }}
        </button>
      </div>
    </div>
  </div>

  <!-- Actualites List Section -->
  <section class="courses section-padding">
    <div class="container">
      <div class="row gy-4">
        <div 
          *ngFor="let item of filteredItems(); let i = index" 
          class="col-lg-4 col-md-6 d-flex align-items-stretch" 
          [attr.data-aos]="'zoom-in'" 
          [attr.data-aos-delay]="i * 100">
          <div class="course-item">
            <a [routerLink]="['/actualites', item.id]" style="cursor: pointer; color: inherit; text-decoration: none;">
              <img [src]="item.image" class="img-fluid course-img" [alt]="item.title">
            </a>
            <div class="course-content">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <p class="category">{{ item.category }}</p>
                <p class="price">{{ formatDate(item.date) }}</p>
              </div>
              <h3><a [routerLink]="['/actualites', item.id]">{{ item.title }}</a></h3>
              <p class="description">{{ item.description }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

</div>
