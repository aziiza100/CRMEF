<div class="pagination-wrapper" *ngIf="totalPages > 1">
  <div class="pagination-info text-muted">
    {{ 'pagination.showing' | translate }} <strong>{{ startItem }}</strong> {{ 'pagination.to' | translate }} <strong>{{ endItem }}</strong> {{ 'pagination.of' | translate }} <strong>{{ totalItems }}</strong> {{ 'pagination.entries' | translate }}
  </div>
  <nav class="pagination-navigation" aria-label="Table navigation">
    <ul class="pagination-list">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <button type="button" class="page-link ctrl-btn" (click)="goToPage(currentPage - 1)" [attr.aria-label]="'pagination.previous' | translate">
          <i class="bi bi-chevron-left"></i>
        </button>
      </li>

      <li class="page-item" *ngFor="let page of visiblePages" [class.active]="page === currentPage">
        <button type="button" class="page-link" (click)="goToPage(page)">{{ page }}</button>
      </li>

      <li class="page-item" [class.disabled]="currentPage === totalPages">
        <button type="button" class="page-link ctrl-btn" (click)="goToPage(currentPage + 1)" [attr.aria-label]="'pagination.next' | translate">
          <i class="bi bi-chevron-right"></i>
        </button>
      </li>
    </ul>
  </nav>
</div>
