<header class="top-wrapper" >
  
  <section id="header" class="header d-flex align-items-center sticky-top">
     <div class="container-fluid container-xl position-relative ">

      <a routerLink="/home" class="logo d-flex align-items-center me-auto">
        <img src="assets/logo-crmef.png" alt="logo">
        <h1 class="sitename"> {{ 'header.title' | translate }}</h1>
      </a>
      <!-- <div class="logo d-flex align-items-center me-auto"> -->
     
    
  
  <!-- </div> -->
    </div>
    <div class="lang-switcher d-flex align-items-center gap-2">

      <button
        class="lang-btn"
        [class.active-lang]="currentLang === 'fr'"
        (click)="changeLang('fr')">
        FR
      </button>

      <button
        class="lang-btn"
        [class.active-lang]="currentLang === 'ar'"
        (click)="changeLang('ar')">
        AR
      </button>

    </div> 
  </section>
   
    <app-navbar></app-navbar> 

</header>
